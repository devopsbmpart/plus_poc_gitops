apiVersion: apps/v1
kind: Deployment
metadata:
  name: plus-poc-app
  labels:
    app: plus-poc-app
  annotations:
    # S6 이 커밋할 때 함께 갱신한다. 배포된 것이 어느 이슈에서 왔는지 남긴다.
    jira.issue: TPS-2473
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plus-poc-app
  template:
    metadata:
      labels:
        app: plus-poc-app
      annotations:
        jira.issue: TPS-2473
    spec:
      containers:
        - name: app
          # 규칙 4 — tag 가 아니라 digest 로 고정한다.
          # 아래는 placeholder 다. 첫 빌드 후 S6 이 실제 digest 로 교체한다.
          image: ghcr.io/devopsbmpart/plus_poc_app@sha256:cea0534ae830d28d13fee51552102757619c3b368fdbd9eeacdc244c371c3f1c
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: JIRA_ISSUE
              value: TPS-2473
            - name: APP_VERSION
              value: '0.2.0'
            - name: SOURCE_REPO
              value: devopsbmpart/plus_poc_app
            # S6 이 커밋할 때 실제 digest 로 치환한다.
            - name: IMAGE_DIGEST
              value: DIGEST_PLACEHOLDER
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
