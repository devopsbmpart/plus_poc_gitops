apiVersion: apps/v1
kind: Deployment
metadata:
  name: plus-poc-app-prd
  labels:
    app: plus-poc-app-prd
    env: prd
  annotations:
    # 플랫폼(S6)이 GitOps 푸시 시 갱신한다.
    jira.issue: TPS-6603
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plus-poc-app-prd
  template:
    metadata:
      labels:
        app: plus-poc-app-prd
        env: prd
      annotations:
        jira.issue: TPS-6603
    spec:
      containers:
        - name: app
          # 규칙 4 — tag 가 아니라 digest 로 고정한다.
          image: docker.io/scmkim/plus_poc_app@sha256:a16ce6b19511833019106be978312f7dcd34787d2131a166be6892921ec1dd21
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: APP_ENV
              value: PRD
            - name: JIRA_ISSUE
              value: TPS-6603
            - name: APP_VERSION
              value: '0.2.0'
            - name: SOURCE_REPO
              value: devopsbmpart/plus_poc_app
            - name: IMAGE_DIGEST
              value: sha256:a16ce6b19511833019106be978312f7dcd34787d2131a166be6892921ec1dd21
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
