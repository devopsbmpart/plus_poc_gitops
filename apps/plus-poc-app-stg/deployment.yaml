apiVersion: apps/v1
kind: Deployment
metadata:
  name: plus-poc-app-stg
  labels:
    app: plus-poc-app-stg
    env: stg
  annotations:
    # 플랫폼(S6)이 GitOps 푸시 시 갱신한다.
    jira.issue: TPS-6602
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plus-poc-app-stg
  template:
    metadata:
      labels:
        app: plus-poc-app-stg
        env: stg
      annotations:
        jira.issue: TPS-6602
    spec:
      containers:
        - name: app
          # 규칙 4 — tag 가 아니라 digest 로 고정한다.
          image: docker.io/scmkim/plus_poc_app2@sha256:8c335a0a13a1f99fdee6bcaecc56a71ae312bc686cc8ed8162b408ef73b1c3d7
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: APP_ENV
              value: STG
            - name: JIRA_ISSUE
              value: TPS-6602
            - name: APP_VERSION
              value: '0.2.0'
            - name: SOURCE_REPO
              value: devopsbmpart/plus_poc_app
            - name: IMAGE_DIGEST
              value: sha256:8c335a0a13a1f99fdee6bcaecc56a71ae312bc686cc8ed8162b408ef73b1c3d7
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
