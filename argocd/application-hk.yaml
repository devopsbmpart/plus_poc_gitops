# Argo CD Application — HK 검증 환경
#
# syncPolicy.automated 를 두지 않는다. 의도적이다.
# 커밋 후에는 OutOfSync 로 대기하고, 사용자가 Sync 를 눌러야 배포된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plus-poc-app-hk
spec:
  project: default

  source:
    repoURL: https://github.com/devopsbmpart/plus_poc_gitops.git
    targetRevision: main
    path: apps/plus-poc-app-hk

  destination:
    server: https://kubernetes.default.svc
    namespace: test-hk

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
